# Vhosts servidos pelo nginx do droplet.
#
# autoextrato.sgecont.com.br -> container autoextrato (em uso)
# whats.sgecont.com.br       -> container evolution-api (WhatsApp)
#
# ATENCAO: o evolution-api nao roda mais neste droplet. Os blocos que apontam
# para ele (whats.sgecont.com.br e /evolution/) respondem 504. Eles seguem aqui
# porque os certificados existem e a intencao e restaurar o servico; enquanto
# isso, o docker-compose precisa do extra_hosts "evolution-api" so para o nginx
# conseguir iniciar. Se o WhatsApp for descontinuado de vez, remova estes blocos
# E o extra_hosts do docker-compose.yml juntos.

# O redirect 80 -> 443 de autoextrato.sgecont.com.br fica em autoextrato.conf
# (montado como default.conf). Repetir o bloco aqui so gerava o aviso
# "conflicting server name ... ignored": conf.d/ carrega default.conf antes de
# ssl.conf, entao esta copia nunca chegava a valer.

server {
    listen 443 ssl http2;
    server_name autoextrato.sgecont.com.br;

    ssl_certificate /etc/letsencrypt/live/autoextrato.sgecont.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoextrato.sgecont.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /assets/ {
        proxy_pass http://evolution-api:8080/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /evolution/ {
        proxy_pass http://evolution-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://autoextrato:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

server {
    listen 80;
    server_name whats.sgecont.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name whats.sgecont.com.br;

    ssl_certificate /etc/letsencrypt/live/whats.sgecont.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whats.sgecont.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://evolution-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
