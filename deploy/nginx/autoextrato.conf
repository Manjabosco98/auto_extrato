server {
    listen 80;
    server_name autoextrato.sgecont.com.br;

    # Validacao do Let's Encrypt (sempre servida via HTTP, sem redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo o restante do trafego e redirecionado para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
